name: Validate skills
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python scripts/validate.py
      - run: python scripts/validate_evidence.py
      - run: python -m unittest discover -s tests -v
  migration-probe:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - run: python swiftdata-migration-checker/scripts/run_migration_probe.py --output "$RUNNER_TEMP/migration-probe"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-probe-results
          path: ${{ runner.temp }}/migration-probe/*.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-probe-summary
          path: ${{ runner.temp }}/migration-probe/results.json
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --offline --include-fragments './**/*.md'
          fail: true
